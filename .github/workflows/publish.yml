name: Publish

# specfocus fork: publishes @specfocus/maplibre-gl to GitHub Packages on every push to main,
# the way every other @specfocus package does. Upstream's release, test-all and codeql
# workflows were removed: they publish to npmjs through maplibre's trusted publishing and
# run hours of render tests on every push.

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com/'

      - name: Install dependencies
        run: npm ci

      - name: Bump package version
        run: npm version patch --no-git-tag-version

      - name: Build package
        run: npm run build-dist

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "ci: bump maplibre-gl version"
          git push
